<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeigertechnik · W124 Cluster</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #030201;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Futura', 'Century Gothic', 'Josefin Sans', sans-serif;
  }
  .cluster {
    background: #060402;
    border-radius: 20px;
    padding: 28px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    box-shadow: 0 0 60px rgba(180,80,0,0.06), 0 0 120px rgba(180,80,0,0.03);
  }
  .brand {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.44em;
    color: #2e1504;
    text-transform: uppercase;
  }
  .gauges-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .gauge-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .gauge-label {
    font-size: 8px;
    font-weight: 300;
    letter-spacing: 0.32em;
    color: #2e1505;
    text-transform: uppercase;
  }
  canvas {
    display: block;
    border-radius: 50%;
    cursor: pointer;
  }
  canvas:hover { filter: brightness(1.08); }

  /* CarPlay dial */
  .cp-dial {
    width: 180px; height: 180px;
    border-radius: 50%;
    background: #060403;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow:
      0 0 0 3px #160b02,
      0 0 0 6px #221106;
  }
  .cp-dial:hover { filter: brightness(1.08); }
  .cp-map { position: absolute; inset: 0; }
  .cp-fg {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; gap: 4px;
  }
  .cp-badge {
    width: 32px; height: 32px;
    background: #b83c0e;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 14px rgba(184,60,14,0.55);
  }
  .cp-badge svg { width: 18px; height: 18px; fill: white; }
  .cp-title { font-size: 8px; letter-spacing: 0.24em; color: #a85a28; }
  .cp-eta { font-size: 7px; color: #3c2008; letter-spacing: 0.1em; margin-top: -2px; }
  .cp-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1.5px solid rgba(150,75,15,0.18);
    pointer-events: none;
  }
  .footnote {
    font-size: 8px; letter-spacing: 0.22em; color: #1e0e04;
  }
</style>
</head>
<body>
<div class="cluster">
  <div class="brand">Zeigertechnik &middot; W124 Digital Cluster</div>
  <div class="gauges-row">

    <!-- Tacho -->
    <div class="gauge-cell">
      <canvas id="tacho" width="180" height="180"></canvas>
      <div class="gauge-label">Drehzahl</div>
    </div>

    <!-- Speedo (slightly larger = dominant) -->
    <div class="gauge-cell">
      <canvas id="speedo" width="220" height="220"></canvas>
      <div class="gauge-label">Geschwindigkeit</div>
    </div>

    <!-- CarPlay -->
    <div class="gauge-cell">
      <div class="cp-dial">
        <svg class="cp-map" width="180" height="180" viewBox="0 0 180 180">
          <rect width="180" height="180" fill="#0b0806"/>
          <line x1="0" y1="63"  x2="180" y2="68"  stroke="#201510" stroke-width="7"/>
          <line x1="0" y1="110" x2="180" y2="106" stroke="#190f08" stroke-width="4"/>
          <line x1="56" y1="0"  x2="60" y2="180"  stroke="#201510" stroke-width="7"/>
          <line x1="122" y1="0" x2="118" y2="180" stroke="#190f08" stroke-width="4"/>
          <line x1="0"   y1="145" x2="180" y2="148" stroke="#190f08" stroke-width="3"/>
          <line x1="28"  y1="0"   x2="24"  y2="180" stroke="#140c06" stroke-width="3"/>
          <!-- Route -->
          <polyline points="58,0 59,65 180,70" fill="none" stroke="#b84510" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
          <!-- Location pin -->
          <circle cx="59" cy="65" r="5.5" fill="#d05015" opacity="0.95"/>
          <circle cx="59" cy="65" r="10"  fill="none" stroke="#d05015" stroke-width="1.2" opacity="0.3"/>
          <!-- Vignette -->
          <defs>
            <radialGradient id="vig" cx="50%" cy="50%" r="50%">
              <stop offset="52%" stop-color="#0b0806" stop-opacity="0"/>
              <stop offset="100%" stop-color="#0b0806" stop-opacity="0.93"/>
            </radialGradient>
          </defs>
          <circle cx="90" cy="90" r="90" fill="url(#vig)"/>
        </svg>
        <div class="cp-fg">
          <div class="cp-badge">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          </div>
          <div class="cp-title">CarPlay</div>
          <div class="cp-eta">ETA 14 min &middot; 8.2 km</div>
        </div>
        <div class="cp-ring"></div>
      </div>
      <div class="gauge-label">Navigation</div>
    </div>

  </div>
  <div class="footnote">&middot; click gauges to toggle demo values &middot;</div>
</div>

<script>
const FONT = "'Futura','Century Gothic','Josefin Sans',sans-serif";

const C = {
  bg:      '#060402',
  track:   '#221204',
  maj:     '#c86010',
  min:     '#6c3208',
  mic:     '#2a1304',
  lbl:     '#c86010',
  redTick: '#c02808',
  redLbl:  '#882010',
  needle:  '#f07818',
  tip:     '#ffaa38',
  back:    '#8e3a0a',
  hub:     '#763608',
  dot:     '#d46c10',
  glow:    '#cc6010',
  readout: '#f09030',
  rdim:    '#4c2808',
  topLbl:  '#221002',
};

const START_DEG = 225;
const SWEEP_DEG = 270;
const START_RAD = START_DEG * Math.PI / 180;
const SWEEP_RAD = SWEEP_DEG * Math.PI / 180;

function v2a(v, mn, mx) {
  return START_RAD + ((v - mn) / (mx - mn)) * SWEEP_RAD;
}
function near(v, s) {
  return Math.abs(Math.round(v / s) * s - v) < s * 0.0015;
}

function drawGauge(id, cfg) {
  const cv = document.getElementById(id);
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const cx = W / 2, cy = H / 2;
  const R = W / 2 - 10;
  const { value, max, min = 0, majS, minS, micS, lblS, redline, unit, topLabel } = cfg;

  ctx.clearRect(0, 0, W, H);

  // ── Face ──────────────────────────────────────────────
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = C.bg;
  ctx.fill();

  // Subtle depth rings
  [0.87, 0.70, 0.52, 0.34].forEach((f, i) => {
    ctx.beginPath();
    ctx.arc(cx, cy, R * f, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(38,16,4,${0.18 - i * 0.03})`;
    ctx.lineWidth = 0.6;
    ctx.stroke();
  });

  // ── Dim track ─────────────────────────────────────────
  ctx.beginPath();
  ctx.arc(cx, cy, R - 18, START_RAD, START_RAD + SWEEP_RAD);
  ctx.strokeStyle = C.track;
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'butt';
  ctx.stroke();

  // ── Redline band ──────────────────────────────────────
  if (redline != null) {
    ctx.beginPath();
    ctx.arc(cx, cy, R - 8, v2a(redline, min, max), START_RAD + SWEEP_RAD);
    ctx.strokeStyle = C.redTick;
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'butt';
    ctx.stroke();
  }

  // ── Active value arc ───────────────────────────────────
  const va = v2a(value, min, max);
  const isRed = redline != null && value >= redline;
  ctx.beginPath();
  ctx.arc(cx, cy, R - 18, START_RAD, va);
  ctx.strokeStyle = isRed ? C.redTick : C.maj;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.shadowColor = isRed ? '#de1808' : C.glow;
  ctx.shadowBlur = 6;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // ── Micro ticks ────────────────────────────────────────
  const micN = Math.round((max - min) / micS);
  for (let i = 0; i <= micN; i++) {
    const v = min + i * micS;
    if (near(v, minS)) continue;
    const a = v2a(v, min, max);
    const rz = redline != null && v >= redline;
    ctx.beginPath();
    ctx.moveTo(cx + (R - 8) * Math.cos(a), cy + (R - 8) * Math.sin(a));
    ctx.lineTo(cx + (R - 13) * Math.cos(a), cy + (R - 13) * Math.sin(a));
    ctx.strokeStyle = rz ? C.redTick + '44' : C.mic;
    ctx.lineWidth = 0.8;
    ctx.lineCap = 'butt';
    ctx.stroke();
  }

  // ── Minor ticks ────────────────────────────────────────
  const minN = Math.round((max - min) / minS);
  for (let i = 0; i <= minN; i++) {
    const v = min + i * minS;
    if (near(v, majS)) continue;
    const a = v2a(v, min, max);
    const rz = redline != null && v >= redline;
    ctx.beginPath();
    ctx.moveTo(cx + (R - 8) * Math.cos(a), cy + (R - 8) * Math.sin(a));
    ctx.lineTo(cx + (R - 16) * Math.cos(a), cy + (R - 16) * Math.sin(a));
    ctx.strokeStyle = rz ? '#521208' : C.min;
    ctx.lineWidth = 1.2;
    ctx.lineCap = 'butt';
    ctx.stroke();
  }

  // ── Major ticks + labels ──────────────────────────────
  const majN = Math.round((max - min) / majS);
  const fs = W < 200 ? 10 : 11;
  for (let i = 0; i <= majN; i++) {
    const v = min + i * majS;
    const a = v2a(v, min, max);
    const rz = redline != null && v >= redline;

    ctx.beginPath();
    ctx.moveTo(cx + (R - 8) * Math.cos(a), cy + (R - 8) * Math.sin(a));
    ctx.lineTo(cx + (R - 22) * Math.cos(a), cy + (R - 22) * Math.sin(a));
    ctx.strokeStyle = rz ? C.redTick : C.maj;
    ctx.lineWidth = 2;
    ctx.lineCap = 'butt';
    ctx.stroke();

    if (near(v, lblS)) {
      const lr = R - 32;
      const lx = cx + lr * Math.cos(a);
      const ly = cy + lr * Math.sin(a);
      ctx.font = `400 ${fs}px ${FONT}`;
      ctx.fillStyle = rz ? C.redLbl : C.lbl;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(v, lx, ly);
    }
  }

  // ── W124-style needle ─────────────────────────────────
  const nL = R * 0.68;
  const nB = 14;
  const nW = W < 200 ? 2.2 : 2.6;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(va);

  ctx.shadowColor = C.glow;
  ctx.shadowBlur = 9;

  // Needle body: tapered, with slight swelling near hub
  ctx.beginPath();
  ctx.moveTo(-nB, nW * 0.55);
  ctx.lineTo(-nB, -nW * 0.55);
  ctx.lineTo(nL * 0.07, -nW);
  ctx.lineTo(nL * 0.20, -nW * 1.12); // subtle swell
  ctx.lineTo(nL, 0);                  // sharp tip
  ctx.lineTo(nL * 0.20, nW * 1.12);
  ctx.lineTo(nL * 0.07, nW);
  ctx.closePath();
  ctx.fillStyle = C.needle;
  ctx.fill();

  ctx.shadowBlur = 0;

  // Tip highlight
  ctx.beginPath();
  ctx.moveTo(nL * 0.68, -nW * 0.35);
  ctx.lineTo(nL, 0);
  ctx.lineTo(nL * 0.68, nW * 0.35);
  ctx.closePath();
  ctx.fillStyle = C.tip;
  ctx.fill();

  // Counterweight stub
  ctx.beginPath();
  ctx.moveTo(-nB, nW * 0.55);
  ctx.lineTo(-nB, -nW * 0.55);
  ctx.lineTo(-5, -nW * 0.55);
  ctx.lineTo(-5, nW * 0.55);
  ctx.closePath();
  ctx.fillStyle = C.back;
  ctx.fill();

  ctx.restore();

  // Hub cap
  const hubR = W < 200 ? 12 : 14;
  ctx.beginPath();
  ctx.arc(cx, cy, hubR, 0, Math.PI * 2);
  ctx.fillStyle = '#0d0702';
  ctx.fill();
  ctx.strokeStyle = C.hub;
  ctx.lineWidth = 1.3;
  ctx.stroke();

  // Hub centre dot
  ctx.beginPath();
  ctx.arc(cx, cy, W < 200 ? 3.8 : 4.5, 0, Math.PI * 2);
  ctx.fillStyle = C.dot;
  ctx.fill();

  // ── Digital readout ───────────────────────────────────
  const ry = cy + R * 0.35;
  const rs = W < 200 ? 22 : 27;
  ctx.font = `600 ${rs}px ${FONT}`;
  ctx.fillStyle = C.readout;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = C.glow;
  ctx.shadowBlur = 16;
  ctx.fillText(Number.isInteger(value) ? value : value.toFixed(1), cx, ry);
  ctx.shadowBlur = 0;

  ctx.font = `300 ${W < 200 ? 7 : 8}px ${FONT}`;
  ctx.fillStyle = C.rdim;
  ctx.fillText(unit, cx, ry + (W < 200 ? 15 : 18));

  if (topLabel) {
    ctx.font = `300 7px ${FONT}`;
    ctx.fillStyle = C.topLbl;
    ctx.fillText(topLabel, cx, cy - R * 0.46);
  }

  // ── Bezel ─────────────────────────────────────────────
  ctx.beginPath();
  ctx.arc(cx, cy, R - 3, 0, Math.PI * 2);
  ctx.strokeStyle = '#110702';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = '#1c0e04';
  ctx.lineWidth = 9;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, R + 4, 0, Math.PI * 2);
  ctx.strokeStyle = '#281508';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// ── Digital Speedo ─────────────────────────────────────
function drawDigitalSpeedo(value, odo, trip) {
  const cv = document.getElementById('speedo');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const cx = W / 2, cy = H / 2;
  const R = W / 2 - 10;
  const min = 0, max = 260, redline = 240;
  const va = v2a(value, min, max);
  const isRed = value >= redline;

  ctx.clearRect(0, 0, W, H);

  // Face
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = C.bg;
  ctx.fill();

  [0.87, 0.70, 0.52, 0.34].forEach((f, i) => {
    ctx.beginPath();
    ctx.arc(cx, cy, R * f, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(38,16,4,${0.18 - i * 0.03})`;
    ctx.lineWidth = 0.6;
    ctx.stroke();
  });

  // Dim track arc
  ctx.beginPath();
  ctx.arc(cx, cy, R - 18, START_RAD, START_RAD + SWEEP_RAD);
  ctx.strokeStyle = C.track;
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'butt';
  ctx.stroke();

  // Redline band
  ctx.beginPath();
  ctx.arc(cx, cy, R - 8, v2a(redline, min, max), START_RAD + SWEEP_RAD);
  ctx.strokeStyle = C.redTick;
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'butt';
  ctx.stroke();

  // Active speed arc (replaces needle)
  ctx.beginPath();
  ctx.arc(cx, cy, R - 18, START_RAD, va);
  ctx.strokeStyle = isRed ? C.redTick : C.maj;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.shadowColor = isRed ? '#de1808' : C.glow;
  ctx.shadowBlur = 8;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Micro ticks (5 km/h)
  for (let v = min; v <= max; v += 5) {
    if (v % 10 === 0) continue;
    const a = v2a(v, min, max);
    ctx.beginPath();
    ctx.moveTo(cx + (R-8)*Math.cos(a), cy + (R-8)*Math.sin(a));
    ctx.lineTo(cx + (R-13)*Math.cos(a), cy + (R-13)*Math.sin(a));
    ctx.strokeStyle = v >= redline ? C.redTick+'44' : C.mic;
    ctx.lineWidth = 0.8; ctx.lineCap = 'butt'; ctx.stroke();
  }

  // Minor ticks (10 km/h)
  for (let v = min; v <= max; v += 10) {
    if (v % 20 === 0) continue;
    const a = v2a(v, min, max);
    ctx.beginPath();
    ctx.moveTo(cx + (R-8)*Math.cos(a), cy + (R-8)*Math.sin(a));
    ctx.lineTo(cx + (R-16)*Math.cos(a), cy + (R-16)*Math.sin(a));
    ctx.strokeStyle = v >= redline ? '#521208' : C.min;
    ctx.lineWidth = 1.2; ctx.lineCap = 'butt'; ctx.stroke();
  }

  // Major ticks + labels (20 km/h)
  for (let v = min; v <= max; v += 20) {
    const a = v2a(v, min, max);
    const rz = v >= redline;
    ctx.beginPath();
    ctx.moveTo(cx + (R-8)*Math.cos(a), cy + (R-8)*Math.sin(a));
    ctx.lineTo(cx + (R-22)*Math.cos(a), cy + (R-22)*Math.sin(a));
    ctx.strokeStyle = rz ? C.redTick : C.maj;
    ctx.lineWidth = 2; ctx.lineCap = 'butt'; ctx.stroke();
    const lr = R - 32;
    ctx.font = `400 11px ${FONT}`;
    ctx.fillStyle = rz ? C.redLbl : C.lbl;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(v, cx + lr*Math.cos(a), cy + lr*Math.sin(a));
  }

  // ── Main speed readout (upper-center) ──────────────────
  const speedY = cy - 26;
  ctx.font = `700 30px ${FONT}`;
  ctx.fillStyle = C.readout;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = C.glow;
  ctx.shadowBlur = 20;
  ctx.fillText(String(Math.round(value)).padStart(3, '0'), cx, speedY);
  ctx.shadowBlur = 0;

  ctx.font = `300 7px ${FONT}`;
  ctx.fillStyle = C.rdim;
  ctx.fillText('km/h', cx, speedY + 19);

  // Hairline separator
  ctx.beginPath();
  ctx.moveTo(cx - 28, speedY + 28); ctx.lineTo(cx + 28, speedY + 28);
  ctx.strokeStyle = '#1e0e04'; ctx.lineWidth = 0.5; ctx.stroke();

  // ── Odometer ──────────────────────────────────────────
  ctx.font = `300 6px ${FONT}`;
  ctx.fillStyle = '#705018';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('km', cx, cy + 2);

  const CW = 16, CH = 20;
  const odoStr = String(Math.floor(odo)).padStart(6, '0');
  const odoLeft = cx - (CW * 6) / 2;
  const odoTop  = cy + 8;

  // Frame
  ctx.fillStyle = '#0a0702'; ctx.strokeStyle = '#3c2010'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(odoLeft - 3, odoTop - 2, CW*6 + 6, CH + 4, 3);
  ctx.fill(); ctx.stroke();

  // Cells
  for (let i = 0; i < 6; i++) {
    const cx2 = odoLeft + i*CW + CW/2, cy2 = odoTop + CH/2;
    ctx.fillStyle = '#060402'; ctx.strokeStyle = '#261208'; ctx.lineWidth = 0.5;
    ctx.fillRect(odoLeft + i*CW, odoTop, CW-1, CH);
    ctx.strokeRect(odoLeft + i*CW, odoTop, CW-1, CH);
    // Cell mid-line for depth
    ctx.beginPath();
    ctx.moveTo(odoLeft + i*CW, odoTop + CH/2);
    ctx.lineTo(odoLeft + i*CW + CW-1, odoTop + CH/2);
    ctx.strokeStyle = '#0e0804'; ctx.lineWidth = 0.4; ctx.stroke();
    // Digit
    ctx.font = `600 13px ${FONT}`;
    ctx.fillStyle = i < 5 ? '#d8c898' : '#c87820';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(odoStr[i], cx2, cy2);
  }

  // ── Trip meter ────────────────────────────────────────
  const TW = 13, TH = 15;
  const tripStr = String(Math.floor(trip)).padStart(5, '0');
  const tripLeft = cx - (TW * 5) / 2;
  const tripTop  = odoTop + CH + 6;

  ctx.fillStyle = '#080601'; ctx.strokeStyle = '#281608'; ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.roundRect(tripLeft - 2, tripTop - 2, TW*5 + 4, TH + 4, 2);
  ctx.fill(); ctx.stroke();

  for (let i = 0; i < 5; i++) {
    const cx2 = tripLeft + i*TW + TW/2, cy2 = tripTop + TH/2;
    ctx.fillStyle = '#050401'; ctx.strokeStyle = '#1a0c04'; ctx.lineWidth = 0.5;
    ctx.fillRect(tripLeft + i*TW, tripTop, TW-1, TH);
    ctx.strokeRect(tripLeft + i*TW, tripTop, TW-1, TH);
    ctx.font = `600 10px ${FONT}`;
    ctx.fillStyle = '#4a4030';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(tripStr[i], cx2, cy2);
  }

  // "A" trip label to the left
  ctx.font = `300 6px ${FONT}`;
  ctx.fillStyle = '#3a2010';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('A', tripLeft - 5, tripTop + TH/2);

  // "km/h" below trip
  ctx.font = `300 6px ${FONT}`;
  ctx.fillStyle = '#3c2010';
  ctx.textAlign = 'center';
  ctx.fillText('km/h', cx, tripTop + TH + 8);

  // ── Bezel ─────────────────────────────────────────────
  ctx.beginPath();
  ctx.arc(cx, cy, R-3, 0, Math.PI*2);
  ctx.strokeStyle = '#110702'; ctx.lineWidth = 2; ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.strokeStyle = '#1c0e04'; ctx.lineWidth = 9; ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, R+4, 0, Math.PI*2);
  ctx.strokeStyle = '#281508'; ctx.lineWidth = 1.5; ctx.stroke();
}

// ── Render both gauges ─────────────────────────────────
let odoKm = 87266, tripKm = 0, currentSp = 0;

function renderAll(sp, rpm) {
  currentSp = sp;
  drawDigitalSpeedo(sp, odoKm, tripKm);
  drawGauge('tacho', {
    value: rpm, max: 7, min: 0,
    majS: 1, minS: 0.5, micS: 0.1, lblS: 1,
    redline: 5.5,
    unit: '×1000/min',
    topLabel: 'DREHZAHLMESSER',
  });
}

// ── Startup animation ─────────────────────────────────
let frame = 0;
const TARGET_SP = 88, TARGET_RPM = 2.3;
function ease(t) { return 1 - Math.pow(1 - t, 3); }
function lerp(a, b, t) { return a + (b - a) * t; }

function animate() {
  frame++;
  const t = ease(Math.min(frame / 90, 1));
  renderAll(
    Math.round(lerp(0, TARGET_SP, t)),
    parseFloat(lerp(0, TARGET_RPM, t).toFixed(1))
  );
  if (frame < 90) requestAnimationFrame(animate);
}
animate();

// Idle drift + odometer roll
setInterval(() => {
  const s = TARGET_SP + (Math.random() - 0.5) * 6;
  const r = TARGET_RPM + (Math.random() - 0.5) * 0.22;
  const sp = Math.round(s);
  if (sp > 0) {
    odoKm  += sp / 3600 * 2.2;
    tripKm += sp / 3600 * 2.2;
  }
  renderAll(sp, parseFloat(r.toFixed(1)));
}, 2200);

// Click to toggle demo values
const demos = [
  [88, 2.3], [140, 3.6], [200, 4.8], [30, 1.1], [0, 0]
];
let demoIdx = 0;
document.getElementById('speedo').onclick =
document.getElementById('tacho').onclick = () => {
  demoIdx = (demoIdx + 1) % demos.length;
  const [sp, rpm] = demos[demoIdx];
  let f2 = 0;
  const from_sp  = currentSp;
  const from_rpm = parseFloat(document.getElementById('tacho').dataset.val || TARGET_RPM);
  function tw() {
    f2++;
    const t2 = ease(Math.min(f2 / 60, 1));
    renderAll(Math.round(lerp(from_sp, sp, t2)), parseFloat(lerp(from_rpm, rpm, t2).toFixed(1)));
    if (f2 < 60) requestAnimationFrame(tw);
  }
  tw();
};
</script>
</body>
