<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeigertechnik - Navigation</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #030201;
    font-family: 'Futura', 'Century Gothic', 'Josefin Sans', sans-serif;
    padding: 24px;
  }
  .panel {
    background: #060402;
    border-radius: 18px;
    border: 1px solid #130902;
    box-shadow: 0 0 60px rgba(180,80,0,0.06), 0 0 120px rgba(180,80,0,0.03);
    padding: 18px 18px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .title {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.3em;
    color: #2e1504;
    text-transform: uppercase;
  }
  .label {
    font-size: 8px;
    font-weight: 300;
    letter-spacing: 0.32em;
    color: #2e1505;
    text-transform: uppercase;
  }
  .note {
    font-size: 8px;
    letter-spacing: 0.22em;
    color: #1e0e04;
  }

  .cp-dial {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: #060403;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 0 3px #160b02, 0 0 0 6px #221106;
  }
  .cp-dial:hover { filter: brightness(1.08); }
  .cp-map { position: absolute; inset: 0; }
  .cp-fg {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .cp-badge {
    width: 36px;
    height: 36px;
    background: #b83c0e;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 14px rgba(184,60,14,0.55);
  }
  .cp-badge svg { width: 20px; height: 20px; fill: #fff; }
  .cp-title { font-size: 9px; letter-spacing: 0.24em; color: #a85a28; }
  .cp-eta { font-size: 8px; color: #3c2008; letter-spacing: 0.1em; margin-top: -2px; }
  .cp-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(150,75,15,0.18);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="title">Navigation</div>
    <div class="cp-dial">
      <svg class="cp-map" width="220" height="220" viewBox="0 0 180 180">
        <rect width="180" height="180" fill="#0b0806"/>
        <line x1="0" y1="63"  x2="180" y2="68"  stroke="#201510" stroke-width="7"/>
        <line x1="0" y1="110" x2="180" y2="106" stroke="#190f08" stroke-width="4"/>
        <line x1="56" y1="0"  x2="60" y2="180"  stroke="#201510" stroke-width="7"/>
        <line x1="122" y1="0" x2="118" y2="180" stroke="#190f08" stroke-width="4"/>
        <line x1="0" y1="145" x2="180" y2="148" stroke="#190f08" stroke-width="3"/>
        <line x1="28" y1="0" x2="24" y2="180" stroke="#140c06" stroke-width="3"/>
        <polyline points="58,0 59,65 180,70" fill="none" stroke="#b84510" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
        <circle cx="59" cy="65" r="5.5" fill="#d05015" opacity="0.95"/>
        <circle cx="59" cy="65" r="10" fill="none" stroke="#d05015" stroke-width="1.2" opacity="0.3"/>
        <defs>
          <radialGradient id="vig" cx="50%" cy="50%" r="50%">
            <stop offset="52%" stop-color="#0b0806" stop-opacity="0"/>
            <stop offset="100%" stop-color="#0b0806" stop-opacity="0.93"/>
          </radialGradient>
        </defs>
        <circle cx="90" cy="90" r="90" fill="url(#vig)"/>
      </svg>
      <div class="cp-fg">
        <div class="cp-badge">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        </div>
        <div class="cp-title">CarPlay</div>
        <div class="cp-eta">ETA 14 min &middot; 8.2 km</div>
      </div>
      <div class="cp-ring"></div>
    </div>
    <div class="label">Navigation</div>
    <div class="note">&middot; standalone CarPlay dial &middot;</div>
  </div>
</body>
</html>
