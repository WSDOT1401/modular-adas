<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeigertechnik - Tacho</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #030201;
    font-family: 'Futura', 'Century Gothic', 'Josefin Sans', sans-serif;
    padding: 24px;
  }
  .panel {
    background: #060402;
    border-radius: 18px;
    border: 1px solid #130902;
    box-shadow: 0 0 60px rgba(180,80,0,0.06), 0 0 120px rgba(180,80,0,0.03);
    padding: 18px 18px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .title {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.3em;
    color: #2e1504;
    text-transform: uppercase;
  }
  .label {
    font-size: 8px;
    font-weight: 300;
    letter-spacing: 0.32em;
    color: #2e1505;
    text-transform: uppercase;
  }
  .note {
    font-size: 8px;
    letter-spacing: 0.22em;
    color: #1e0e04;
  }
  canvas {
    display: block;
    border-radius: 50%;
    cursor: pointer;
  }
  canvas:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <div class="panel">
    <div class="title">Tacho</div>
    <canvas id="tacho" width="220" height="220"></canvas>
    <div class="label">Drehzahl</div>
    <div class="note">&middot; click gauge to cycle demo values &middot;</div>
  </div>

<script>
const FONT = "'Futura','Century Gothic','Josefin Sans',sans-serif";

const C = {
  bg:      '#060402',
  track:   '#221204',
  maj:     '#c86010',
  min:     '#6c3208',
  mic:     '#2a1304',
  lbl:     '#c86010',
  redTick: '#c02808',
  redLbl:  '#882010',
  needle:  '#f07818',
  tip:     '#ffaa38',
  back:    '#8e3a0a',
  hub:     '#763608',
  dot:     '#d46c10',
  glow:    '#cc6010',
  readout: '#f09030',
  rdim:    '#4c2808',
  topLbl:  '#221002',
};

const START_DEG = 225;
const SWEEP_DEG = 270;
const START_RAD = START_DEG * Math.PI / 180;
const SWEEP_RAD = SWEEP_DEG * Math.PI / 180;

function v2a(v, mn, mx) {
  return START_RAD + ((v - mn) / (mx - mn)) * SWEEP_RAD;
}
function near(v, s) {
  return Math.abs(Math.round(v / s) * s - v) < s * 0.0015;
}

function drawGauge(id, cfg) {
  const cv = document.getElementById(id);
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const cx = W / 2, cy = H / 2;
  const R = W / 2 - 10;
  const { value, max, min = 0, majS, minS, micS, lblS, redline, unit, topLabel } = cfg;

  ctx.clearRect(0, 0, W, H);

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = C.bg;
  ctx.fill();

  [0.87, 0.70, 0.52, 0.34].forEach((f, i) => {
    ctx.beginPath();
    ctx.arc(cx, cy, R * f, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(38,16,4,${0.18 - i * 0.03})`;
    ctx.lineWidth = 0.6;
    ctx.stroke();
  });

  ctx.beginPath();
  ctx.arc(cx, cy, R - 18, START_RAD, START_RAD + SWEEP_RAD);
  ctx.strokeStyle = C.track;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (redline != null) {
    ctx.beginPath();
    ctx.arc(cx, cy, R - 8, v2a(redline, min, max), START_RAD + SWEEP_RAD);
    ctx.strokeStyle = C.redTick;
    ctx.lineWidth = 3.5;
    ctx.stroke();
  }

  const va = v2a(value, min, max);
  const isRed = redline != null && value >= redline;
  ctx.beginPath();
  ctx.arc(cx, cy, R - 18, START_RAD, va);
  ctx.strokeStyle = isRed ? C.redTick : C.maj;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.shadowColor = isRed ? '#de1808' : C.glow;
  ctx.shadowBlur = 6;
  ctx.stroke();
  ctx.shadowBlur = 0;

  const micN = Math.round((max - min) / micS);
  for (let i = 0; i <= micN; i++) {
    const v = min + i * micS;
    if (near(v, minS)) continue;
    const a = v2a(v, min, max);
    const rz = redline != null && v >= redline;
    ctx.beginPath();
    ctx.moveTo(cx + (R - 8) * Math.cos(a), cy + (R - 8) * Math.sin(a));
    ctx.lineTo(cx + (R - 13) * Math.cos(a), cy + (R - 13) * Math.sin(a));
    ctx.strokeStyle = rz ? C.redTick + '44' : C.mic;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  const minN = Math.round((max - min) / minS);
  for (let i = 0; i <= minN; i++) {
    const v = min + i * minS;
    if (near(v, majS)) continue;
    const a = v2a(v, min, max);
    const rz = redline != null && v >= redline;
    ctx.beginPath();
    ctx.moveTo(cx + (R - 8) * Math.cos(a), cy + (R - 8) * Math.sin(a));
    ctx.lineTo(cx + (R - 16) * Math.cos(a), cy + (R - 16) * Math.sin(a));
    ctx.strokeStyle = rz ? '#521208' : C.min;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  const majN = Math.round((max - min) / majS);
  const fs = W < 200 ? 10 : 11;
  for (let i = 0; i <= majN; i++) {
    const v = min + i * majS;
    const a = v2a(v, min, max);
    const rz = redline != null && v >= redline;

    ctx.beginPath();
    ctx.moveTo(cx + (R - 8) * Math.cos(a), cy + (R - 8) * Math.sin(a));
    ctx.lineTo(cx + (R - 22) * Math.cos(a), cy + (R - 22) * Math.sin(a));
    ctx.strokeStyle = rz ? C.redTick : C.maj;
    ctx.lineWidth = 2;
    ctx.stroke();

    if (near(v, lblS)) {
      const lr = R - 32;
      const lx = cx + lr * Math.cos(a);
      const ly = cy + lr * Math.sin(a);
      ctx.font = `400 ${fs}px ${FONT}`;
      ctx.fillStyle = rz ? C.redLbl : C.lbl;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(v, lx, ly);
    }
  }

  const nL = R * 0.68;
  const nB = 14;
  const nW = W < 200 ? 2.2 : 2.6;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(va);

  ctx.shadowColor = C.glow;
  ctx.shadowBlur = 9;

  ctx.beginPath();
  ctx.moveTo(-nB, nW * 0.55);
  ctx.lineTo(-nB, -nW * 0.55);
  ctx.lineTo(nL * 0.07, -nW);
  ctx.lineTo(nL * 0.20, -nW * 1.12);
  ctx.lineTo(nL, 0);
  ctx.lineTo(nL * 0.20, nW * 1.12);
  ctx.lineTo(nL * 0.07, nW);
  ctx.closePath();
  ctx.fillStyle = C.needle;
  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.beginPath();
  ctx.moveTo(nL * 0.68, -nW * 0.35);
  ctx.lineTo(nL, 0);
  ctx.lineTo(nL * 0.68, nW * 0.35);
  ctx.closePath();
  ctx.fillStyle = C.tip;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-nB, nW * 0.55);
  ctx.lineTo(-nB, -nW * 0.55);
  ctx.lineTo(-5, -nW * 0.55);
  ctx.lineTo(-5, nW * 0.55);
  ctx.closePath();
  ctx.fillStyle = C.back;
  ctx.fill();

  ctx.restore();

  const hubR = W < 200 ? 12 : 14;
  ctx.beginPath();
  ctx.arc(cx, cy, hubR, 0, Math.PI * 2);
  ctx.fillStyle = '#0d0702';
  ctx.fill();
  ctx.strokeStyle = C.hub;
  ctx.lineWidth = 1.3;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, W < 200 ? 3.8 : 4.5, 0, Math.PI * 2);
  ctx.fillStyle = C.dot;
  ctx.fill();

  const ry = cy + R * 0.35;
  const rs = W < 200 ? 22 : 27;
  ctx.font = `600 ${rs}px ${FONT}`;
  ctx.fillStyle = C.readout;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = C.glow;
  ctx.shadowBlur = 16;
  ctx.fillText(value.toFixed(1), cx, ry);
  ctx.shadowBlur = 0;

  ctx.font = `300 ${W < 200 ? 7 : 8}px ${FONT}`;
  ctx.fillStyle = C.rdim;
  ctx.fillText(unit, cx, ry + (W < 200 ? 15 : 18));

  if (topLabel) {
    ctx.font = '300 7px ' + FONT;
    ctx.fillStyle = C.topLbl;
    ctx.fillText(topLabel, cx, cy - R * 0.46);
  }

  ctx.beginPath();
  ctx.arc(cx, cy, R - 3, 0, Math.PI * 2);
  ctx.strokeStyle = '#110702';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.strokeStyle = '#1c0e04';
  ctx.lineWidth = 9;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, R + 4, 0, Math.PI * 2);
  ctx.strokeStyle = '#281508';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  cv.dataset.val = String(value);
}

function renderTacho(rpm) {
  drawGauge('tacho', {
    value: rpm,
    max: 7,
    min: 0,
    majS: 1,
    minS: 0.5,
    micS: 0.1,
    lblS: 1,
    redline: 5.5,
    unit: 'x1000/min',
    topLabel: 'DREHZAHLMESSER'
  });
}

const TARGET = 2.3;
let frame = 0;
function ease(t) { return 1 - Math.pow(1 - t, 3); }
function lerp(a, b, t) { return a + (b - a) * t; }

function animate() {
  frame++;
  const t = ease(Math.min(frame / 90, 1));
  renderTacho(parseFloat(lerp(0, TARGET, t).toFixed(1)));
  if (frame < 90) requestAnimationFrame(animate);
}
animate();

setInterval(() => {
  const next = TARGET + (Math.random() - 0.5) * 0.22;
  renderTacho(parseFloat(next.toFixed(1)));
}, 2200);

const demos = [2.3, 3.6, 4.8, 1.1, 0];
let idx = 0;
document.getElementById('tacho').onclick = () => {
  idx = (idx + 1) % demos.length;
  const to = demos[idx];
  const from = parseFloat(document.getElementById('tacho').dataset.val || TARGET);
  let f = 0;
  function tween() {
    f++;
    const t = ease(Math.min(f / 60, 1));
    renderTacho(parseFloat(lerp(from, to, t).toFixed(1)));
    if (f < 60) requestAnimationFrame(tween);
  }
  tween();
};
</script>
</body>
</html>
