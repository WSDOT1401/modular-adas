[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "w124-protocol"
version = "0.1.0"
description = "Shared IPC contract (UDP vehicle-state schema + publisher) for the W124 digital cluster"
requires-python = ">=3.9"

# Install editable from the repo root so every service shares one copy:
#   pip install -e libs/protocol/python

[tool.setuptools.packages.find]
where = ["."]
include = ["w124_protocol*"]
