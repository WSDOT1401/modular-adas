<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dataset builder{% endblock %}</title>
  {# Inline, so the browser stops asking for a favicon.ico that does not exist
     and logging a 404 into the console on every single page load. #}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f6feb'/%3E%3Crect x='3' y='4.5' width='10' height='7' rx='1' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Thai sign dataset</a>
    {% block topbar %}{% endblock %}
  </header>
  <main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
